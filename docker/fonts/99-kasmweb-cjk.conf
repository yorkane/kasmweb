<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  99-kasmweb-cjk.conf - kasmweb default-font policy: CJK first, SC (Simplified
  Chinese) variant first.

  Why (measured on Alpine 3.17 + font-noto-cjk, the stack of this image):
    fc-match sans-serif             -> DejaVu Sans          (no CJK coverage)
    fc-match sans-serif:lang=zh-cn  -> "Noto Sans CJK JP"   (CJK, JP glyph variant)
  The base ships font-noto (no CJK) + the generic 45/60/65 conf.d rules, so the
  generic aliases resolve to Latin-only families and zh lands on the JP face of
  the shared NotoSansCJK-Regular.ttc. Chinese UI text renders JP glyph shapes.

  Numbered 99 so it parses AFTER the generic/language rules (conf.d ascending
  order); alias-prefer and prepend edits therefore win the family ordering.

  Family names = fc-scan over the shipped files (one TTC, five regional faces):
    NotoSansCJK-{Regular,Bold}.ttc  -> Noto Sans CJK SC/TC/JP/KR/HK
                                       Noto Sans Mono CJK SC/TC/JP/KR/HK
    NotoSerifCJK-{Regular,Bold}.ttc -> Noto Serif CJK SC/TC/JP/KR/HK
  The build gate asserts the three * CJK SC names literally, so a base that
  renames them fails the build instead of shipping tofu.

  Portability: NO compare="is_any" (fontconfig &lt; 2.13.92 treats an unknown
  compare as a failed test, which makes a bare lang-only test unconditional);
  one plain family test per match block.
-->
<fontconfig>

  <!-- ===== generic aliases: SC first, Latin fallback kept ===== -->
  <!-- binding="strong" prefer = insert at the HEAD of the family list. -->
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
    <default>
      <family>DejaVu Sans</family>
      <family>Liberation Sans</family>
      <family>Noto Sans</family>
    </default>
  </alias>
  <alias binding="strong">
    <family>sans</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
    <default>
      <family>DejaVu Sans</family>
      <family>Liberation Sans</family>
      <family>Noto Sans</family>
    </default>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
    <default>
      <family>DejaVu Serif</family>
      <family>Liberation Serif</family>
      <family>Noto Serif</family>
    </default>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>Noto Sans Mono CJK SC</family></prefer>
    <default>
      <family>DejaVu Sans Mono</family>
      <family>Liberation Mono</family>
    </default>
  </alias>

  <!-- ===== language rules: zh forces the SC face on every generic ===== -->
  <!-- compare="contains" zh matches zh / zh-cn / zh-hans / zh-sg requests. -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh</string></test>
    <test name="family"><string>sans</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh</string></test>
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Mono CJK SC</string>
    </edit>
  </match>

  <!-- Design note: zh-tw / zh-hk requests land on SC too (the zh blocks above
       match them by "contains", and the probe on the image stack shows SC as
       family[0] for zh-cn / zh-tw / zh-hk). SC glyph shapes remain readable
       Traditional Chinese; deliberate per-region routing is out of scope. -->

  <!-- ===== regional Noto aliases rank SC above JP/KR/TC/HK for zh ===== -->
  <!-- Chrome/GTK ship hardcoded "Noto Sans CJK JP"-style requests; under a zh
       locale the SC face must lead. One block per regional family. -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh</string></test>
    <test name="family"><string>Noto Sans CJK JP</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh</string></test>
    <test name="family"><string>Noto Sans CJK KR</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh</string></test>
    <test name="family"><string>Noto Sans CJK TC</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh</string></test>
    <test name="family"><string>Noto Sans CJK HK</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh</string></test>
    <test name="family"><string>Noto Sans Mono CJK JP</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans Mono CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh</string></test>
    <test name="family"><string>Noto Sans Mono CJK KR</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans Mono CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh</string></test>
    <test name="family"><string>Noto Sans Mono CJK TC</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans Mono CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh</string></test>
    <test name="family"><string>Noto Sans Mono CJK HK</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans Mono CJK SC</string></edit>
  </match>
  <alias binding="weak">
    <family>Noto Sans CJK</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
  </alias>
  <alias binding="weak">
    <family>Noto Serif CJK</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
  </alias>
  <alias binding="weak">
    <family>Noto Sans Mono CJK</family>
    <prefer><family>Noto Sans Mono CJK SC</family></prefer>
  </alias>

  <!-- ===== CJK rendering hygiene (vector face, LCD subpixel) ===== -->
  <match target="font">
    <test name="family" compare="contains"><string>CJK</string></test>
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>

</fontconfig>

