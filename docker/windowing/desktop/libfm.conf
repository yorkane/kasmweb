# /etc/xdg/libfm/libfm.conf - system libfm config shipped by this image.
#
# quick_exec is FALSE by default (FM_CONFIG_DEFAULT_QUICK_EXEC in
# libfm-1.3.2/src/gtk/fm-config.h). With it off, double-clicking an
# application/x-desktop file on the pcmanfm desktop opens the "this file seems
# to be an executable script, would you like to execute it?" confirmation
# (fm-gtk-file-launcher.c on_exec_file), and x-desktop counts as text
# (shared-mime application/x-desktop is sub-class-of text/plain), so the panel
# says "text file" - which is exactly what users saw on the Kasm canvas.
# quick_exec=1 makes on_exec_file launch directly. System scope so a future
# user config can override it per seat.
[config]
quick_exec=1
